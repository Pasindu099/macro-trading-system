# Alembic configuration for Macro Dashboard.
#
# The database URL is loaded dynamically in migrations/env.py from our
# app.settings module, so you won't find it hardcoded here — that's
# intentional. Don't add sqlalchemy.url below; it'll be ignored.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
path_separator = os

# Timezone for timestamps in migration filenames
timezone = UTC

# Format for new migration files: 2026_04_18_1430-abc123_description.py
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

[post_write_hooks]
# Format newly-generated migrations with ruff
hooks = ruff
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S