<div class="data-freshness" role="status" aria-label="Data freshness">
  {% for row in rows %}<span class="data-freshness-item"><b>{{ row.label }}</b> as of {{ row.as_of_label or 'unknown' }}{% if row.stale %} <strong class="data-stale">stale</strong> <small>{{ row.reason }}</small>{% endif %}</span>{% endfor %}
</div>
