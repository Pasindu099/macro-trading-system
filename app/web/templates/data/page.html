{% extends "base.html" %}
{% block extra_head %}
<link rel="stylesheet" href="{{ url_for('static', path='css/data.css') }}">
<script src="{{ url_for('static', path='js/data.js') }}" defer></script>
{% endblock %}
{% block body %}
<main class="data-page">
  <header class="data-heading"><div><p class="eyebrow"><a href="/data">Data</a> / Reference library</p><h1>{{ title }}</h1>
    <p class="data-muted">Release history, data quality and source-backed research datasets.</p></div>
    <a class="data-button" href="/data/sources">Source health</a></header>
  <div id="data-content" data-content-url="{{ content_url }}" aria-live="polite" aria-busy="true">
    <p class="data-state" data-state="loading">Loading data&hellip;</p>
  </div>
  <noscript><p class="data-state">Enable JavaScript to load this reference view.</p></noscript>
</main>
{% endblock %}
