{% extends "base.html" %}

{% block extra_head %}
<style>
/* ── Page shell ──────────────────────────────────────────────────────────── */
.mm-shell { padding: 0 !important; }
.mm-page-header {
  padding: 20px 28px 0;
  border-bottom: 1px solid #1e3244;
  background: #071018;
}
.mm-page-title { font-size: 20px; font-weight: 700; color: #dce8f2; margin: 0 0 2px; }
.mm-page-sub   { font-size: 12px; color: #637a8a; margin: 0 0 16px; }

/* ── Country tab bar ─────────────────────────────────────────────────────── */
.mm-tabs {
  display: flex; gap: 0; overflow-x: auto; scrollbar-width: none;
}
.mm-tabs::-webkit-scrollbar { display: none; }
.mm-tab {
  display: flex; align-items: center; gap: 6px;
  padding: 10px 20px; cursor: pointer; border: none; background: none;
  color: #637a8a; font-size: 12px; font-weight: 500; white-space: nowrap;
  border-bottom: 2px solid transparent; transition: color .15s, border-color .15s;
  font-family: inherit;
}
.mm-tab:hover { color: #b8ccd9; }
.mm-tab.active { color: #ff8c42; border-bottom-color: #ff8c42; }
.mm-tab-flag { font-size: 15px; }

/* ── Content ─────────────────────────────────────────────────────────────── */
.mm-content { padding: 20px 28px 40px; }
.mm-section { display: none; }
.mm-section.active { display: block; }

/* ── CB banner ───────────────────────────────────────────────────────────── */
.mm-banner {
  display: flex; align-items: center; gap: 0;
  background: rgba(255,255,255,0.025); border: 1px solid #1e3244;
  border-radius: 8px; margin-bottom: 20px; overflow: hidden;
}
.mm-banner-cb {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 20px; flex: 1; min-width: 0;
  border-right: 1px solid #1e3244;
}
.mm-banner-flag { font-size: 22px; flex-shrink: 0; }
.mm-banner-info { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.mm-banner-bank { font-size: 15px; font-weight: 700; color: #dce8f2; }
.mm-banner-full { font-size: 11px; color: #637a8a; }
.mm-banner-stat {
  display: flex; flex-direction: column; align-items: center;
  padding: 10px 20px; border-right: 1px solid #1e3244; flex-shrink: 0;
}
.mm-banner-stat:last-child { border-right: none; }
.mm-banner-slabel { font-size: 10px; color: #637a8a; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 3px; }
.mm-banner-sval { font-size: 16px; font-weight: 700; color: #dce8f2; }
.mm-banner-sval.rate-val { color: #ff8c42; }

/* ── Metrics grid ────────────────────────────────────────────────────────── */
.mm-metrics-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 12px; margin-bottom: 20px;
}
.mm-metric-card {
  background: rgba(255,255,255,0.025); border: 1px solid #1e3244;
  border-radius: 8px; padding: 14px 16px; position: relative;
  transition: border-color .15s;
}
.mm-metric-card.primary { border-color: rgba(255,140,66,0.35); background: rgba(255,140,66,0.04); }
.mm-metric-card:hover { border-color: #2a4a62; }
.mm-metric-label {
  font-size: 10px; color: #637a8a; text-transform: uppercase;
  letter-spacing: 0.05em; margin-bottom: 8px;
  display: flex; align-items: center; gap: 5px;
}
.mm-primary-dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: #ff8c42; flex-shrink: 0;
}
.mm-metric-val-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
.mm-metric-val { font-size: 22px; font-weight: 700; color: #dce8f2; }
.mm-metric-unit { font-size: 11px; color: #637a8a; }
.mm-metric-delta {
  font-size: 10px; font-weight: 700; padding: 2px 5px; border-radius: 3px;
}
.delta-up   { background: rgba(255,90,126,0.15); color: #ff8aa8; }
.delta-down { background: rgba(35,196,131,0.12); color: #23c483; }
.delta-up.lower-better   { background: rgba(35,196,131,0.12); color: #23c483; }
.delta-down.lower-better { background: rgba(255,90,126,0.15); color: #ff8aa8; }
.delta-flat { background: rgba(255,255,255,0.06); color: #637a8a; }
.mm-target-row {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 10px; color: #637a8a; margin-bottom: 6px;
}
.mm-target-badge {
  font-size: 9px; font-weight: 700; padding: 2px 5px; border-radius: 3px;
  text-transform: uppercase; letter-spacing: 0.05em;
}
.tbadge-hot    { background: rgba(255,90,126,0.15); color: #ff8aa8; border: 1px solid rgba(255,90,126,0.25); }
.tbadge-above  { background: rgba(255,140,66,0.15); color: #ff8c42; border: 1px solid rgba(255,140,66,0.25); }
.tbadge-on     { background: rgba(35,196,131,0.12); color: #23c483; border: 1px solid rgba(35,196,131,0.2); }
.tbadge-below  { background: rgba(80,181,255,0.12); color: #50b5ff; border: 1px solid rgba(80,181,255,0.2); }
.mm-sparkline-wrap { position: relative; height: 36px; margin-top: 4px; }
.mm-no-data { font-size: 11px; color: #355063; font-style: italic; margin-top: 4px; }

/* ── Chart section ───────────────────────────────────────────────────────── */
.mm-charts-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 16px;
}
.mm-chart-card {
  background: rgba(255,255,255,0.02); border: 1px solid #1e3244; border-radius: 8px; overflow: hidden;
}
.mm-chart-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 14px; border-bottom: 1px solid #1e3244;
}
.mm-chart-title { font-size: 11px; font-weight: 700; color: #8fa5b5; text-transform: uppercase; letter-spacing: 0.05em; }
.mm-chart-period { font-size: 10px; color: #355063; }
.mm-chart-wrap { position: relative; height: 160px; padding: 12px 12px 8px; }
</style>
{% endblock %}

{% block body %}
<div class="mm-shell">
<div class="mm-page-header">
  <h1 class="mm-page-title">Macro Monitor</h1>
  <p class="mm-page-sub">Central bank preferred indicators — live data from economic releases</p>
  <div class="mm-tabs" id="mm-tabs"></div>
</div>
<div class="mm-content" id="mm-content"></div>
</div>

<script id="mm-raw-data" type="application/json">{{ mm_data | tojson }}</script>

<script>
(function () {
"use strict";

const RAW = JSON.parse(document.getElementById("mm-raw-data").textContent || "[]");

/* ── helpers ──────────────────────────────────────────────────────────────── */
function fmt(v, unit) {
  if (v == null) return "—";
  if (unit === "K") return (v >= 0 ? "+" : "") + v.toFixed(0) + "K";
  if (unit === "idx") return v.toFixed(1);
  return v.toFixed(1);
}

function deltaClass(cur, prev, lowerBetter) {
  if (cur == null || prev == null) return "delta-flat";
  const up = cur > prev;
  const cls = up ? "delta-up" : cur < prev ? "delta-down" : "delta-flat";
  return lowerBetter ? cls + " lower-better" : cls;
}

function deltaText(cur, prev, unit) {
  if (cur == null || prev == null) return "";
  const d = cur - prev;
  const sign = d >= 0 ? "+" : "";
  if (unit === "K") return sign + d.toFixed(0) + "K";
  return sign + d.toFixed(1);
}

function targetBadge(cur, target, lowerBetter, unit) {
  if (cur == null || target == null) return "";
  const diff = cur - target;
  let cls, label;
  if (unit === "idx") {
    cls = cur >= 52 ? "tbadge-hot" : cur >= 50 ? "tbadge-above" : "tbadge-below";
    label = cur >= 52 ? "Expanding" : cur >= 50 ? "Growing" : "Contracting";
  } else if (lowerBetter) {
    cls = diff > 0.5 ? "tbadge-hot" : diff > 0 ? "tbadge-above" : "tbadge-on";
    label = diff > 0.5 ? "High" : diff > 0 ? "Above" : "On Target";
  } else {
    const absDiff = Math.abs(diff);
    if (diff > 1.0)  { cls = "tbadge-hot";   label = "Well Above"; }
    else if (diff > 0.3) { cls = "tbadge-above"; label = "Above"; }
    else if (absDiff <= 0.3) { cls = "tbadge-on"; label = "On Target"; }
    else { cls = "tbadge-below"; label = "Below"; }
  }
  return `<span class="mm-target-badge ${cls}">${label}</span>`;
}

/* ── sparkline (Chart.js tiny line) ──────────────────────────────────────── */
const CHART_REGISTRY = {};

function drawSparkline(canvasId, history, color) {
  const el = document.getElementById(canvasId);
  if (!el || !history || history.length < 2) return;
  if (CHART_REGISTRY[canvasId]) { CHART_REGISTRY[canvasId].destroy(); }
  CHART_REGISTRY[canvasId] = new Chart(el, {
    type: "line",
    data: {
      labels: history.map(p => p[0]),
      datasets: [{
        data: history.map(p => p[1]),
        borderColor: color || "#ff8c42",
        borderWidth: 1.5,
        pointRadius: 0,
        fill: false,
        tension: 0.3,
        spanGaps: true,
      }],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      animation: false,
      plugins: { legend: { display: false }, tooltip: { enabled: false } },
      scales: { x: { display: false }, y: { display: false } },
    },
  });
}

/* ── full history Chart.js chart ─────────────────────────────────────────── */
function drawHistoryChart(canvasId, history, label, color, unit) {
  const el = document.getElementById(canvasId);
  if (!el || !history || history.length < 2) return;
  if (CHART_REGISTRY[canvasId]) { CHART_REGISTRY[canvasId].destroy(); }
  CHART_REGISTRY[canvasId] = new Chart(el, {
    type: "line",
    data: {
      labels: history.map(p => p[0]),
      datasets: [{
        label,
        data: history.map(p => p[1]),
        borderColor: color,
        backgroundColor: color + "18",
        borderWidth: 2,
        pointRadius: 2,
        pointHoverRadius: 5,
        fill: true,
        tension: 0.3,
        spanGaps: true,
      }],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: "rgba(7,16,24,0.95)", borderColor: "#1e3244", borderWidth: 1,
          titleColor: "#dce8f2", bodyColor: "#8fa5b5",
          callbacks: {
            label: ctx => ` ${label}: ${ctx.parsed.y != null ? ctx.parsed.y.toFixed(2) + (unit === "%" ? "%" : unit === "idx" ? "" : "") : "—"}`,
          },
        },
      },
      scales: {
        x: { ticks: { color: "#637a8a", font: { size: 9 }, maxTicksLimit: 8 }, grid: { color: "rgba(255,255,255,0.03)" } },
        y: {
          ticks: { color: "#637a8a", font: { size: 9 }, callback: v => v.toFixed(1) + (unit === "%" ? "%" : "") },
          grid: { color: "rgba(255,255,255,0.05)" },
        },
      },
    },
  });
}

/* ── metric card HTML ─────────────────────────────────────────────────────── */
const METRIC_COLORS = [
  "#ff8c42","#23c483","#50b5ff","#f3ba63","#e05aff","#ff5a7e","#56cfad","#a78bfa"
];

function metricCard(cb, m, idx) {
  const md = (cb.metrics_data || {})[m.key] || {};
  const cur = md.current, prev = md.previous, hist = md.history || [];
  const lb = !!m.lower_better;
  const sparkId = `spark-${cb.id}-${m.key}`;
  const color = METRIC_COLORS[idx % METRIC_COLORS.length];

  const targetRow = m.target != null ? `
    <div class="mm-target-row">
      <span>Target: ${m.target}${m.unit === "%" ? "%" : ""}</span>
      ${targetBadge(cur, m.target, lb, m.unit)}
    </div>` : "";

  const body = cur != null ? `
    <div class="mm-metric-val-row">
      <span class="mm-metric-val">${fmt(cur, m.unit)}</span>
      <span class="mm-metric-unit">${m.unit}</span>
      ${prev != null ? `<span class="mm-metric-delta ${deltaClass(cur, prev, lb)}">${deltaText(cur, prev, m.unit)}</span>` : ""}
    </div>
    ${targetRow}
    <div class="mm-sparkline-wrap"><canvas id="${sparkId}"></canvas></div>
  ` : `<div class="mm-no-data">No data</div>`;

  return {
    html: `
      <div class="mm-metric-card${m.primary ? " primary" : ""}">
        <div class="mm-metric-label">
          ${m.primary ? '<span class="mm-primary-dot"></span>' : ""}
          ${m.label}
        </div>
        ${body}
      </div>`,
    sparkId, hist, color,
  };
}

/* ── section HTML ─────────────────────────────────────────────────────────── */
function buildSection(cb) {
  const rateStr = cb.rate != null ? cb.rate.toFixed(2) + "%" : "—";

  // Banner
  const banner = `
    <div class="mm-banner">
      <div class="mm-banner-cb">
        <span class="mm-banner-flag">${cb.flag}</span>
        <div class="mm-banner-info">
          <span class="mm-banner-bank">${cb.bank} — ${cb.country}</span>
          <span class="mm-banner-full">${cb.name}</span>
        </div>
      </div>
      <div class="mm-banner-stat">
        <span class="mm-banner-slabel">Policy Rate</span>
        <span class="mm-banner-sval rate-val">${rateStr}</span>
      </div>
      <div class="mm-banner-stat">
        <span class="mm-banner-slabel">Infl. Target</span>
        <span class="mm-banner-sval">${cb.inflation_target}%</span>
      </div>
      <div class="mm-banner-stat">
        <span class="mm-banner-slabel">Currency</span>
        <span class="mm-banner-sval">${cb.currency}</span>
      </div>
    </div>`;

  // Metric cards
  const cards = cb.metrics.map((m, i) => metricCard(cb, m, i));
  const metricsGrid = `<div class="mm-metrics-grid">${cards.map(c => c.html).join("")}</div>`;

  // History charts (primary + inflation metrics only)
  const chartItems = cb.metrics.filter(m => m.primary || ["cpi","core_cpi","unemp","gdp","trimmed","core_ex","median"].includes(m.key));
  const chartHtml = chartItems.map((m, i) => {
    const md = (cb.metrics_data || {})[m.key] || {};
    const hist = md.history || [];
    const cid = `hchart-${cb.id}-${m.key}`;
    const color = METRIC_COLORS[i % METRIC_COLORS.length];
    if (hist.length < 2) return "";
    return `
      <div class="mm-chart-card">
        <div class="mm-chart-head">
          <span class="mm-chart-title">${m.label}</span>
          <span class="mm-chart-period">18 months</span>
        </div>
        <div class="mm-chart-wrap"><canvas id="${cid}"></canvas></div>
      </div>`;
  }).filter(Boolean).join("");

  const chartsSection = chartHtml ? `<div class="mm-charts-grid">${chartHtml}</div>` : "";

  return { banner, metricsGrid, chartsSection, cards, chartItems };
}

/* ── render ───────────────────────────────────────────────────────────────── */
function render() {
  if (!RAW || RAW.length === 0) {
    document.getElementById("mm-content").innerHTML = '<p style="color:#637a8a;padding:40px 0">No data available.</p>';
    return;
  }

  const tabsEl = document.getElementById("mm-tabs");
  const contentEl = document.getElementById("mm-content");

  const tabs = [], sections = [];
  const sparks = [], hcharts = [];

  RAW.forEach((cb, idx) => {
    const active = idx === 0 ? " active" : "";
    tabs.push(`<button class="mm-tab${active}" onclick="mmSwitch('${cb.id}')" id="mmtab-${cb.id}">
      <span class="mm-tab-flag">${cb.flag}</span>${cb.bank}
    </button>`);

    const s = buildSection(cb);
    sections.push(`<div class="mm-section${active}" id="mmsec-${cb.id}">
      ${s.banner}${s.metricsGrid}${s.chartsSection}
    </div>`);

    // Collect sparklines and history charts to draw after DOM insert
    s.cards.forEach(c => { if (c.sparkId && c.hist.length >= 2) sparks.push({id: c.sparkId, hist: c.hist, color: c.color}); });
    s.chartItems.forEach((m, i) => {
      const md = (cb.metrics_data || {})[m.key] || {};
      const hist = md.history || [];
      if (hist.length < 2) return;
      sparks.push({id: `hchart-${cb.id}-${m.key}`, hist, color: METRIC_COLORS[i % METRIC_COLORS.length], full: true, label: m.label, unit: m.unit});
    });
  });

  tabsEl.innerHTML = tabs.join("");
  contentEl.innerHTML = sections.join("");

  // Draw charts after DOM is ready
  requestAnimationFrame(() => {
    sparks.forEach(s => {
      if (s.full) drawHistoryChart(s.id, s.hist, s.label, s.color, s.unit);
      else drawSparkline(s.id, s.hist, s.color);
    });
  });
}

window.mmSwitch = function (id) {
  document.querySelectorAll(".mm-section").forEach(el => el.classList.remove("active"));
  document.querySelectorAll(".mm-tab").forEach(el => el.classList.remove("active"));
  const sec = document.getElementById("mmsec-" + id);
  const tab = document.getElementById("mmtab-" + id);
  if (sec) sec.classList.add("active");
  if (tab) tab.classList.add("active");

  // Draw charts for this section if not yet drawn
  requestAnimationFrame(() => {
    const cb = RAW.find(c => c.id === id);
    if (!cb) return;
    cb.metrics.forEach((m, i) => {
      const md = (cb.metrics_data || {})[m.key] || {};
      drawSparkline(`spark-${id}-${m.key}`, md.history, METRIC_COLORS[i % METRIC_COLORS.length]);
      if (m.primary || ["cpi","core_cpi","unemp","gdp","trimmed","core_ex","median"].includes(m.key)) {
        drawHistoryChart(`hchart-${id}-${m.key}`, md.history, m.label, METRIC_COLORS[i % METRIC_COLORS.length], m.unit);
      }
    });
  });
};

if (typeof Chart !== "undefined") render();
else {
  const s = document.querySelector("script[src*='chart']");
  if (s) s.addEventListener("load", render, {once: true});
  else setTimeout(render, 600);
}

})();
</script>
{% endblock body %}
