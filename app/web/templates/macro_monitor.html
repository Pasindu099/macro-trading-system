{% extends "base.html" %}

{% block extra_head %}
<style>
/* ── Page shell ─────────────────────────────────────────────── */
.mm-shell {
  padding: 0 !important;
  background: #1a0e05;
  min-height: 100vh;
  color: #e8d5b0;
  font-family: system-ui, -apple-system, sans-serif;
  font-size: 13px;
}

/* ── Country tab bar ─────────────────────────────────────────── */
.mm-tabs {
  display: flex;
  gap: 0;
  background: #1e1208;
  border-bottom: 1px solid #2e1e0a;
  overflow-x: auto;
  scrollbar-width: none;
}
.mm-tabs::-webkit-scrollbar { display: none; }
.mm-tab {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 11px 18px;
  cursor: pointer;
  border: none;
  background: none;
  color: #6a5535;
  font-size: 12.5px;
  font-weight: 500;
  white-space: nowrap;
  border-bottom: 2px solid transparent;
  transition: color .15s, border-color .15s;
  font-family: inherit;
}
.mm-tab:hover { color: #a87844; }
.mm-tab.active {
  color: #e8843a;
  border-bottom-color: #e8843a;
}
.mm-tab-flag { font-size: 16px; line-height: 1; }

/* ── Content wrapper ─────────────────────────────────────────── */
.mm-content {
  max-width: 1440px;
  margin: 0 auto;
  padding: 16px 20px 32px;
}

/* ── CB Banner ───────────────────────────────────────────────── */
.mm-banner {
  display: flex;
  align-items: center;
  gap: 24px;
  background: #1e1208;
  border: 1px solid #2e1e0a;
  border-radius: 8px;
  padding: 14px 20px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.mm-banner-cb {
  display: flex;
  align-items: center;
  gap: 10px;
  flex: 1;
  min-width: 160px;
}
.mm-banner-icon { font-size: 20px; }
.mm-banner-name {
  font-size: 14px;
  font-weight: 600;
  color: #e8d5b0;
}
.mm-banner-divider {
  width: 1px;
  height: 28px;
  background: #2e1e0a;
  flex-shrink: 0;
}
.mm-banner-item { text-align: center; }
.mm-banner-label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: .06em;
  color: #6a5535;
  margin-bottom: 3px;
}
.mm-banner-val {
  font-size: 16px;
  font-weight: 700;
  color: #e8d5b0;
}
.mm-score-bar {
  width: 80px;
  height: 4px;
  background: #2e1e0a;
  border-radius: 2px;
  margin-top: 5px;
  overflow: hidden;
}
.mm-score-fill { height: 100%; border-radius: 2px; background: #e8843a; }
.mm-stance {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .04em;
  text-transform: uppercase;
}
.mm-stance-hawkish { background: rgba(232,132,58,.2); color: #e8843a; border: 1px solid rgba(232,132,58,.35); }
.mm-stance-neutral  { background: rgba(210,180,80,.15); color: #d4b24a; border: 1px solid rgba(210,180,80,.3); }
.mm-stance-dovish   { background: rgba(80,130,210,.15); color: #6aaddc; border: 1px solid rgba(80,130,210,.3); }
.mm-banner-meeting { font-size: 12px; color: #6a5535; }
.mm-banner-meeting strong { color: #a87844; }

/* ── Stat cards ──────────────────────────────────────────────── */
.mm-stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 16px;
}
@media (max-width: 900px) { .mm-stats { grid-template-columns: repeat(2,1fr); } }
.mm-stat {
  background: #1e1208;
  border: 1px solid #2e1e0a;
  border-radius: 8px;
  padding: 14px 16px;
  border-top: 2px solid;
}
.mm-stat-label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: .07em;
  color: #6a5535;
  margin-bottom: 8px;
}
.mm-stat-row {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 4px;
}
.mm-stat-val {
  font-size: 26px;
  font-weight: 700;
  color: #e8d5b0;
  line-height: 1;
}
.mm-stat-unit { font-size: 13px; color: #6a5535; }
.mm-delta {
  font-size: 11px;
  font-weight: 600;
  padding: 2px 5px;
  border-radius: 3px;
}
.mm-delta-bad  { color: #e85050; background: rgba(232,80,80,.1); }
.mm-delta-good { color: #4a9e5c; background: rgba(74,158,92,.1); }
.mm-stat-sub { font-size: 11px; color: #6a5535; }

/* ── Three-panel row ─────────────────────────────────────────── */
.mm-panels {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 16px;
}
@media (max-width: 860px) { .mm-panels { grid-template-columns: 1fr; } }
.mm-panel {
  background: #1e1208;
  border: 1px solid #2e1e0a;
  border-radius: 8px;
  overflow: hidden;
}
.mm-panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 14px;
  border-bottom: 1px solid #2e1e0a;
  background: #211408;
}
.mm-panel-title {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .07em;
  font-weight: 600;
  color: #a87844;
}
.mm-status-badge {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .05em;
  text-transform: uppercase;
  padding: 2px 7px;
  border-radius: 3px;
}
.mm-status-hot     { background: rgba(232,80,80,.15);  color: #e85050; border: 1px solid rgba(232,80,80,.3); }
.mm-status-above   { background: rgba(232,132,58,.15); color: #e8843a; border: 1px solid rgba(232,132,58,.3); }
.mm-status-target  { background: rgba(74,158,92,.15);  color: #4a9e5c; border: 1px solid rgba(74,158,92,.3); }
.mm-status-tight   { background: rgba(232,132,58,.15); color: #e8843a; border: 1px solid rgba(232,132,58,.3); }
.mm-status-balanced{ background: rgba(210,180,80,.12); color: #d4b24a; border: 1px solid rgba(210,180,80,.25); }
.mm-status-soft    { background: rgba(80,130,210,.12); color: #6aaddc; border: 1px solid rgba(80,130,210,.25); }
.mm-status-expand  { background: rgba(74,158,92,.15);  color: #4a9e5c; border: 1px solid rgba(74,158,92,.3); }
.mm-status-slow    { background: rgba(210,180,80,.12); color: #d4b24a; border: 1px solid rgba(210,180,80,.25); }
.mm-status-contract{ background: rgba(232,80,80,.15);  color: #e85050; border: 1px solid rgba(232,80,80,.3); }
.mm-panel-body { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.mm-metric { display: flex; flex-direction: column; gap: 4px; }
.mm-metric-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
}
.mm-metric-name { font-size: 11px; color: #6a5535; flex: 1; }
.mm-metric-val  { font-size: 13px; font-weight: 600; color: #e8d5b0; }
.mm-metric-delta { font-size: 10px; font-weight: 600; padding: 1px 4px; border-radius: 2px; }
.mm-bar-track {
  height: 3px;
  background: #2e1e0a;
  border-radius: 1px;
  overflow: hidden;
}
.mm-bar-fill { height: 100%; border-radius: 1px; }
.mm-bar-red    { background: #e85050; }
.mm-bar-orange { background: #e8843a; }
.mm-bar-green  { background: #4a9e5c; }
.mm-bar-gray   { background: #3a2810; }
.mm-metric-target {
  font-size: 10px;
  color: #4a5568;
  display: flex;
  justify-content: flex-end;
}
.mm-pmi-val { font-weight: 700; }
.mm-pmi-hot { color: #4a9e5c; }
.mm-pmi-cold { color: #e85050; }

/* ── Bottom row ──────────────────────────────────────────────── */
.mm-bottom {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
@media (max-width: 780px) { .mm-bottom { grid-template-columns: 1fr; } }
.mm-chart-card {
  background: #1e1208;
  border: 1px solid #2e1e0a;
  border-radius: 8px;
  overflow: hidden;
}
.mm-chart-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 14px;
  border-bottom: 1px solid #2e1e0a;
  background: #211408;
}
.mm-chart-title {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .07em;
  font-weight: 600;
  color: #a87844;
}
.mm-chart-tabs { display: flex; gap: 4px; }
.mm-chart-tab {
  padding: 3px 9px;
  font-size: 11px;
  font-weight: 500;
  border-radius: 4px;
  cursor: pointer;
  border: 1px solid #2e1e0a;
  background: none;
  color: #6a5535;
  font-family: inherit;
  transition: color .15s, border-color .15s;
}
.mm-chart-tab.active { border-color: #e8843a; color: #e8843a; }
.mm-chart-body { padding: 14px; }
.mm-chart-wrap { position: relative; height: 180px; }
#mm-chart { position: absolute; inset: 0; }

/* ── FX signals ──────────────────────────────────────────────── */
.mm-fx-card {
  background: #1e1208;
  border: 1px solid #2e1e0a;
  border-radius: 8px;
  overflow: hidden;
}
.mm-fx-head {
  padding: 10px 14px;
  border-bottom: 1px solid #2e1e0a;
  background: #211408;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .07em;
  font-weight: 600;
  color: #a87844;
}
.mm-fx-body { padding: 4px 0; }
.mm-fx-row {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 12px 14px;
  border-bottom: 1px solid rgba(46,30,10,.5);
}
.mm-fx-row:last-child { border-bottom: none; }
.mm-fx-pair {
  font-size: 13px;
  font-weight: 700;
  color: #e8d5b0;
  min-width: 68px;
  font-variant-numeric: tabular-nums;
}
.mm-fx-dir {
  font-size: 10px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 3px;
  flex-shrink: 0;
  margin-top: 1px;
}
.mm-fx-bull { background: rgba(30,80,40,.7); color: #4a9e5c; border: 1px solid rgba(74,158,92,.4); }
.mm-fx-bear { background: rgba(80,20,20,.7); color: #e85050; border: 1px solid rgba(232,80,80,.4); }
.mm-fx-neut { background: rgba(100,80,20,.5); color: #d4b24a; border: 1px solid rgba(210,180,80,.3); }
.mm-fx-reason { font-size: 11.5px; color: #6a5535; line-height: 1.5; flex: 1; }
</style>
{% endblock %}

const MONTHS = ['Dec','Jan','Feb','Mar','Apr','May','Jun'];

/* ═══════════════════════════════════════════════════════════
   CHART
═══════════════════════════════════════════════════════════ */
let chart = null;
let chartMode = 'cpi'; // 'cpi' | 'unemp'
let currentCountry = C[0];

function buildChart(country) {
  const canvas = document.getElementById('mm-chart');
  if (!canvas) return;
  if (chart) { chart.destroy(); chart = null; }

  const isCpi = chartMode === 'cpi';
  const data  = isCpi ? country.chartData : country.unempChart;
  const color = isCpi ? '#e85050' : '#e8843a';
  const label = isCpi ? 'CPI %' : 'Unemployment %';

  chart = new Chart(canvas.getContext('2d'), {
    type: 'line',
    data: {
      labels: MONTHS,
      datasets: [{
        label,
        data,
        borderColor: color,
        backgroundColor: 'transparent',
        borderWidth: 1.5,
        pointRadius: 3,
        pointBackgroundColor: color,
        tension: 0.3,
      }],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#211408',
          borderColor: '#2e1e0a',
          borderWidth: 1,
          titleColor: '#e8d5b0',
          bodyColor: '#a87844',
          callbacks: { label: ctx => ' ' + ctx.parsed.y.toFixed(1) + '%' },
        },
      },
      scales: {
        x: {
          ticks: { color: '#4a3520', font: { size: 10 } },
          grid:  { color: '#1a0e04' },
        },
        y: {
          ticks: { color: '#4a3520', font: { size: 10 }, callback: v => v.toFixed(1) + '%' },
          grid:  { color: '#1a0e04' },
        },
      },
    },
  });
}

function fmt(v, dec=1) {
  if (v == null) return '—';
  return v.toFixed(dec);

function delta(curr, prev, invertLogic) {
  // invertLogic=true → up is BAD (CPI, unemployment)
  // invertLogic=false → up is GOOD (GDP, NFP, PMI)
  if (prev == null || curr == null) return '';
  const diff = curr - prev;
  if (Math.abs(diff) < 0.001) return '';
  const up    = diff > 0;
  const arrow = up ? '▲' : '▼';
  const bad   = invertLogic ? up : !up;
  const cls   = bad ? 'mm-delta-bad' : 'mm-delta-good';
  return `<span class="mm-delta ${cls}">${arrow} ${Math.abs(diff).toFixed(1)}</span>`;
}

function metricDelta(curr, prev, invertLogic) {
  if (prev == null || curr == null) return '';
  const diff = curr - prev;
  if (Math.abs(diff) < 0.001) return '';
  const up    = diff > 0;
  const arrow = up ? '▲' : '▼';
  const bad   = invertLogic ? up : !up;
  const col   = bad ? '#e85050' : '#4a9e5c';
  return `<span class="mm-metric-delta" style="color:${col}">${arrow}${Math.abs(diff).toFixed(1)}</span>`;
}

function bar(pct, cls) {
  const w = Math.min(100, Math.max(0, pct));
  return `<div class="mm-bar-track"><div class="mm-bar-fill ${cls}" style="width:${w}%"></div></div>`;
}

function inflationStatus(cpi) {
  if (cpi > 3) return ['HOT', 'mm-status-hot'];
  if (cpi > 2.2) return ['ABOVE TARGET', 'mm-status-above'];
  return ['ON TARGET', 'mm-status-target'];
}
function laborStatus(unemp) {
  if (unemp < 4.0) return ['TIGHT', 'mm-status-tight'];
  if (unemp < 5.0) return ['BALANCED', 'mm-status-balanced'];
  return ['SOFTENING', 'mm-status-soft'];
}
function growthStatus(gdp) {
  if (gdp > 1.0) return ['EXPANDING', 'mm-status-expand'];
  if (gdp >= 0)  return ['SLOW', 'mm-status-slow'];
  return ['CONTRACTING', 'mm-status-contract'];
}
function wagePressure(unemp) {
  if (unemp < 4.0) return 'High';
  if (unemp < 5.0) return 'Moderate';
  return 'Low';
}
function stanceCls(stance) {
  if (stance === 'hawkish') return 'mm-stance-hawkish';
  if (stance === 'dovish')  return 'mm-stance-dovish';
  return 'mm-stance-neutral';
}
function fxDirCls(dir) {
  if (dir === 'BULL') return 'mm-fx-bull';
  if (dir === 'BEAR') return 'mm-fx-bear';
  return 'mm-fx-neut';
}

/* ═══════════════════════════════════════════════════════════
   RENDER
═══════════════════════════════════════════════════════════ */
function render(country) {
  currentCountry = country;

  /* ── CB Banner ─── */
  const banner = `
<div class="mm-banner">
  <div class="mm-banner-cb">
    <span class="mm-banner-icon">${country.cbIcon}</span>
    <span class="mm-banner-name">${country.cb}</span>
  </div>
  <div class="mm-banner-divider"></div>
  <div class="mm-banner-item">
    <div class="mm-banner-label">Policy Rate</div>
    <div class="mm-banner-val">${fmt(country.rate, 2)}%</div>
  </div>
  <div class="mm-banner-divider"></div>
  <div class="mm-banner-item">
    <div class="mm-banner-label">Macro Score</div>
    <div class="mm-banner-val">${country.score}</div>
    <div class="mm-score-bar"><div class="mm-score-fill" style="width:${country.score}%"></div></div>
  </div>
  <div class="mm-banner-divider"></div>
  <div class="mm-banner-item">
    <div class="mm-banner-label">Stance</div>
    <span class="mm-stance ${stanceCls(country.stance)}">${country.stance}</span>
  </div>
  <div class="mm-banner-divider"></div>
  <div class="mm-banner-item">
    <div class="mm-banner-label">Next Meeting</div>
    <div class="mm-banner-meeting"><strong>${country.nextMeeting}</strong></div>
  </div>
</div>`;

  /* ── Stat cards ─── */
  const statCards = [
    {
      label: 'Headline CPI', top: '#e85050',
      val: fmt(country.cpi) + '%',
      delta: delta(country.cpi, country.cpiPrev, true),
      sub: `Core ${fmt(country.core)}% · Target 2.0%`,
    },
    {
      label: 'Unemployment', top: '#e8843a',
      val: fmt(country.unemp) + '%',
      delta: delta(country.unemp, country.unempPrev, true),
      sub: country.nfp != null ? `NFP ${country.nfp > 0 ? '+' : ''}${country.nfp}K` : `Wage: ${wagePressure(country.unemp)}`,
    },
    {
      label: 'GDP Growth', top: '#4a9e5c',
      val: fmt(country.gdp) + '%',
      delta: delta(country.gdp, country.gdpPrev, false),
      sub: `PMI ${fmt(country.pmi)} · Retail ${country.retail > 0 ? '+' : ''}${fmt(country.retail)}%`,
    },
    {
      label: 'Policy Rate', top: '#6aaddc',
      val: fmt(country.rate, 2) + '%',
      delta: '',
      sub: `Score ${country.score}/100 · ${country.stance}`,
    },
  ];

  const stats = `<div class="mm-stats">${statCards.map(s => `
<div class="mm-stat" style="border-top-color:${s.top}">
  <div class="mm-stat-label">${s.label}</div>
  <div class="mm-stat-row">
    <div class="mm-stat-val">${s.val}</div>
    ${s.delta}
  </div>
  <div class="mm-stat-sub">${s.sub}</div>
</div>`).join('')}</div>`;

  /* ── Inflation panel ─── */
  const [infStatus, infStatusCls] = inflationStatus(country.cpi);
  const maxCpi = 8;
  const inflationRows = [
    { name: 'Headline CPI', val: country.cpi,  prev: country.cpiPrev,  unit: '%', max: maxCpi, inv: true },
    { name: 'Core CPI',     val: country.core, prev: country.corePrev, unit: '%', max: maxCpi, inv: true },
    ...(country.pce != null ? [{ name: 'PCE',   val: country.pce,  prev: country.pcePrev,  unit: '%', max: maxCpi, inv: true }] : []),
    { name: 'CB Target', val: 2.0, prev: null, unit: '%', max: maxCpi, inv: false, isTarget: true },
  ];
  const inflationPanel = `
<div class="mm-panel">
  <div class="mm-panel-head">
    <span class="mm-panel-title">Inflation</span>
    <span class="mm-status-badge ${infStatusCls}">${infStatus}</span>
  </div>
  <div class="mm-panel-body">
    ${inflationRows.map(r => `
<div class="mm-metric">
  <div class="mm-metric-top">
    <span class="mm-metric-name">${r.name}</span>
    <span class="mm-metric-val">${fmt(r.val)}${r.unit}</span>
    ${r.isTarget ? '' : metricDelta(r.val, r.prev, r.inv)}
  </div>
  ${bar((r.val / r.max) * 100, r.isTarget ? 'mm-bar-gray' : 'mm-bar-red')}
</div>`).join('')}
  </div>
</div>`;

  /* ── Labor panel ─── */
  const [labStatus, labStatusCls] = laborStatus(country.unemp);
  const maxUnemp = 12;
  const laborRows = [
    { name: 'Unemployment', val: country.unemp, prev: country.unempPrev, unit: '%', max: maxUnemp, inv: true },
    ...(country.nfp != null ? [{ name: 'Jobs Added',  val: country.nfp,   prev: country.nfpPrev,  unit: 'K',  max: 500,   inv: false }] : []),
    { name: 'Wage Pressure', val: null, prev: null, unit: '', label: wagePressure(country.unemp) },
  ];
  const laborPanel = `
<div class="mm-panel">
  <div class="mm-panel-head">
    <span class="mm-panel-title">Labor Market</span>
    <span class="mm-status-badge ${labStatusCls}">${labStatus}</span>
  </div>
  <div class="mm-panel-body">
    ${laborRows.map(r => r.label !== undefined ? `
<div class="mm-metric">
  <div class="mm-metric-top">
    <span class="mm-metric-name">Wage Pressure</span>
    <span class="mm-metric-val">${r.label}</span>
  </div>
  ${bar(r.label === 'High' ? 85 : r.label === 'Moderate' ? 50 : 20, 'mm-bar-orange')}
</div>` : `
<div class="mm-metric">
  <div class="mm-metric-top">
    <span class="mm-metric-name">${r.name}</span>
    <span class="mm-metric-val">${r.val != null ? fmt(Math.abs(r.val)) + r.unit : '—'}</span>
    ${r.val != null ? metricDelta(r.val, r.prev, r.inv) : ''}
  </div>
  ${r.val != null ? bar((Math.abs(r.val) / r.max) * 100, 'mm-bar-orange') : ''}
</div>`).join('')}
  </div>
</div>`;

  /* ── Growth panel ─── */
  const [grwStatus, grwStatusCls] = growthStatus(country.gdp);
  const pmiCls = country.pmi >= 50 ? 'mm-pmi-hot' : 'mm-pmi-cold';
  const growthPanel = `
<div class="mm-panel">
  <div class="mm-panel-head">
    <span class="mm-panel-title">Growth</span>
    <span class="mm-status-badge ${grwStatusCls}">${grwStatus}</span>
  </div>
  <div class="mm-panel-body">
    <div class="mm-metric">
      <div class="mm-metric-top">
        <span class="mm-metric-name">GDP QoQ</span>
        <span class="mm-metric-val">${fmt(country.gdp)}%</span>
        ${metricDelta(country.gdp, country.gdpPrev, false)}
      </div>
      ${bar(Math.max(0, (country.gdp / 4) * 100), 'mm-bar-green')}
    </div>
    <div class="mm-metric">
      <div class="mm-metric-top">
        <span class="mm-metric-name">Manufacturing PMI</span>
        <span class="mm-metric-val mm-pmi-val ${pmiCls}">${fmt(country.pmi)}</span>
        ${metricDelta(country.pmi, country.pmiPrev, false)}
      </div>
      ${bar(((country.pmi - 40) / 20) * 100, country.pmi >= 50 ? 'mm-bar-green' : 'mm-bar-red')}
    </div>
    <div class="mm-metric">
      <div class="mm-metric-top">
        <span class="mm-metric-name">Retail Sales MoM</span>
        <span class="mm-metric-val">${country.retail >= 0 ? '+' : ''}${fmt(country.retail)}%</span>
        ${metricDelta(country.retail, country.retailPrev, false)}
      </div>
      ${bar(Math.max(0, ((country.retail + 2) / 4) * 100), country.retail >= 0 ? 'mm-bar-green' : 'mm-bar-red')}
    </div>
  </div>
</div>`;

  /* ── Bottom row ─── */
  const bottom = `
<div class="mm-bottom">
  <div class="mm-chart-card">
    <div class="mm-chart-head">
      <span class="mm-chart-title">7-Month Trend</span>
      <div class="mm-chart-tabs">
        <button class="mm-chart-tab ${chartMode==='cpi'?'active':''}" onclick="setChartMode('cpi')">CPI</button>
        <button class="mm-chart-tab ${chartMode==='unemp'?'active':''}" onclick="setChartMode('unemp')">Unemployment</button>
      </div>
    </div>
    <div class="mm-chart-body">
      <div class="mm-chart-wrap"><canvas id="mm-chart"></canvas></div>
    </div>
  </div>

  <div class="mm-fx-card">
    <div class="mm-fx-head">FX Signals</div>
    <div class="mm-fx-body">
      ${country.signals.map(s => `
<div class="mm-fx-row">
  <span class="mm-fx-pair">${s.pair}</span>
  <span class="mm-fx-dir ${fxDirCls(s.dir)}">${s.dir}</span>
  <span class="mm-fx-reason">${s.reason}</span>
</div>`).join('')}
    </div>
  </div>
</div>`;

  /* ── Inject ─── */
  document.getElementById('mm-main').innerHTML = banner + stats +
    `<div class="mm-panels">${inflationPanel}${laborPanel}${growthPanel}</div>` + bottom;

  buildChart(country);
}

function setChartMode(mode) {
  chartMode = mode;
  render(currentCountry);
}
window.setChartMode = setChartMode;

/* ═══════════════════════════════════════════════════════════
   TABS
═══════════════════════════════════════════════════════════ */
function buildTabs() {
  const container = document.getElementById('mm-tabs');
  container.innerHTML = C.map((c, i) => `
<button class="mm-tab${i===0?' active':''}" data-id="${c.id}" onclick="selectTab(this,'${c.id}')">
  <span class="mm-tab-flag">${c.flag}</span>
  <span>${c.name}</span>
</button>`).join('');
}

function selectTab(el, id) {
  document.querySelectorAll('.mm-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  const country = C.find(c => c.id === id);
  if (country) render(country);
}
window.selectTab = selectTab;

/* ═══════════════════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════════════════ */
window.addEventListener('load', function () {
  buildTabs();
  render(C[0]);
});

})();
</script>
{% endblock %}
