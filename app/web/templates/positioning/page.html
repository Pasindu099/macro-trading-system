{% extends "base.html" %}
{% block extra_head %}
<link rel="stylesheet" href="{{ url_for('static', path='css/overview.css') }}">
<link rel="stylesheet" href="{{ url_for('static', path='css/positioning.css') }}">
<link rel="stylesheet" href="{{ url_for('static', path='css/positioning_v2.css') }}">
<script src="{{ url_for('static', path='vendor/htmx-1.9.12.min.js') }}" defer></script>
<script src="{{ url_for('static', path='js/positioning.js') }}" defer></script>
{% endblock %}
{% block body %}
<main class="pos-page pos18 overview" data-ccy="{{ p.ccy }}">
  <div class="pos-grid">
    {% for panel in panels %}
    <section class="overview-panel pos-panel posp-{{ panel }}" aria-label="{{ titles[panel] }}" id="pos-{{ panel }}">
      <div hx-get="/positioning/panels/{{ panel }}?{{ panel_query }}"
           hx-trigger="{{ 'load' if loop.index <= 3 else 'revealed once' }}" hx-swap="innerHTML">
        <h2>{{ titles[panel] }}</h2><p class="panel-state state-loading">Loading…</p>
      </div>
    </section>
    {% endfor %}
  </div>
</main>
{% endblock %}
