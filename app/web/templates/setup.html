{% extends "base.html" %}

{% block body %}
<main class="auth-shell">
    <section class="auth-card">
        <div class="auth-mark">M</div>
        <p class="eyebrow">First run</p>
        <h1>Create the admin account</h1>
        <p class="auth-note">This user can manage access levels and invite the rest of the desk.</p>
        {% if error %}
            <p class="auth-error">{{ error }}</p>
        {% endif %}
        <form method="post" action="/setup" class="auth-form">
            <label>
                <span>Email</span>
                <input name="email" type="email" autocomplete="email" required autofocus>
            </label>
            <label>
                <span>Display name</span>
                <input name="display_name" autocomplete="name" placeholder="Macro desk admin">
            </label>
            <label>
                <span>Password</span>
                <input name="password" type="password" autocomplete="new-password" minlength="10" required>
            </label>
            <button class="btn primary" type="submit">Create admin</button>
        </form>
    </section>
</main>
{% endblock %}
