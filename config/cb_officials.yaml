# ECB Governing Council page, BoE MPC page, BoJ Policy Board page, BoC Governing Council page;
# SNB, RBA, RBNZ from search results of their own pages / announcements (source: secondary).
# voter: always | rotating (ECB monthly NCB rotation) | {year: bool} (Fed presidents) | never.
# start/end: tenure on the committee; null = before the 12-month window / ongoing. dates_verified marks
# dates confirmed on an official page.
# aliases: matched case-sensitively at word boundaries. ambiguous: true means the alias is only used
# when the text also names the bank (e.g. "Williams" = Fed NY or RBNZ).

