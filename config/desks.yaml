# Currency desks. Only enabled desks are routed; others return 404.
# Indicator series name canonical names in the `indicators` table. A name that is
# not in the DB (or a `canonical: null` placeholder) renders as unavailable; never
# substitute a different series.
desks:
  USD:
    enabled: true
    name: US Dollar Desk
    currency: USD
    country: US              # indicators.country_code
    curve_country: US        # government_yield_observations.country_code
    cb: FED                  # rate probability / CB policy bank code
    cb_name: Federal Reserve
    cb_short: Fed
    policy_indicator: fed_interest_rate_decision
    charts:
      - id: infl
        title: Inflation
        sub: YoY % · monthly
        unit: "%"
        ref: 2
        ref_label: Fed target 2%
        series:
          - {name: CPI, canonical: cpi_headline_yoy}
          - {name: Core CPI, canonical: core_cpi_yoy}
          - {name: Core PCE, canonical: core_pce_price_index_yoy}
      - id: ur
        title: Unemployment rate
        sub: "% · monthly"
        unit: "%"
        series:
          - {name: Unemployment, canonical: unemployment_rate}
          - {name: U-6, canonical: u6_unemployment_rate}
      - id: gdp
        title: Real GDP
        sub: QoQ annualised % · quarterly
        unit: "%"
        bars: true
        series:
          - {name: GDP QoQ ann., canonical: real_gdp_qoq_annualised}
      - id: ism-m
        title: ISM Manufacturing
        sub: Diffusion index · monthly
        unit: ""
        ref: 50
        ref_label: 50 = expansion
        series:
          - {name: Headline, canonical: ism_manufacturing_pmi}
          - {name: Prices paid, canonical: ism_manufacturing_prices}
          - {name: New orders, canonical: ism_manufacturing_new_orders}
          - {name: Employment, canonical: ism_manufacturing_employment}
          - {name: Production, canonical: ism_manufacturing_production}
      - id: ism-s
        title: ISM Services
        sub: Diffusion index · monthly
        unit: ""
        ref: 50
        ref_label: 50 = expansion
        series:
          - {name: Headline, canonical: ism_services_pmi}
          - {name: Prices paid, canonical: ism_services_prices}
          - {name: New orders, canonical: ism_services_new_orders}
          - {name: Employment, canonical: ism_services_employment}
          - {name: Business activity, canonical: ism_services_business_activity}
      - id: nfp
        title: Nonfarm Payrolls
        sub: Monthly change, thousands
        unit: k
        bars: true
        three_month_avg: true
        series:
          - {name: Payrolls, canonical: nfp}
  EUR:
    enabled: true
    name: Euro Desk
    currency: EUR
    country: EU
    curve_country: DE
    cb: ECB
    cb_name: European Central Bank
    cb_short: ECB
    policy_indicator: ecb_deposit_rate
    members:
      - {code: EZ, country: EU}
      - {code: DE, country: DE}
      - {code: FR, country: FR}
    key_data:
      - {id: hicp, label: HICP YoY, series: {EZ: cpi_headline_yoy, DE: hicp_yoy, FR: hicp_yoy}}
      - {id: core_hicp, label: Core HICP YoY, series: {EZ: core_cpi_yoy, DE: null, FR: null}}
      - {id: unemployment, label: Unemployment, series: {EZ: unemployment_rate, DE: unemployment_rate, FR: unemployment_rate}}
      - {id: gdp, label: Real GDP QoQ (not annualised), series: {EZ: gdp_qoq, DE: gdp_qoq, FR: gdp_qoq}}
      - {id: manufacturing_pmi, label: HCOB Manufacturing PMI, series: {EZ: manufacturing_pmi, DE: manufacturing_pmi, FR: manufacturing_pmi}}
      - {id: services_pmi, label: HCOB Services PMI, series: {EZ: services_pmi, DE: services_pmi, FR: services_pmi}}
      - {id: business_sentiment, label: Business sentiment, series: {EZ: economic_sentiment, DE: ifo_business_climate, FR: business_confidence}}
      - {id: wage_growth, label: Wage growth, series: {EZ: null, DE: null, FR: null}}
    charts:
      - id: infl
        title: Inflation
        sub: YoY %
        unit: "%"
        ref: 2
        ref_label: ECB target 2%
        series:
          - {name: HICP, canonical: cpi_headline_yoy}
          - {name: Core HICP, canonical: core_cpi_yoy}
      - id: ur
        title: Unemployment rate
        sub: "%"
        unit: "%"
        series:
          - {name: Unemployment, canonical: unemployment_rate}
      - id: gdp
        title: Real GDP
        sub: QoQ % (not annualised)
        unit: "%"
        bars: true
        series:
          - {name: GDP QoQ, canonical: gdp_qoq}
  GBP:
    enabled: true
    name: Sterling Desk
    currency: GBP
    country: UK
    curve_country: UK
    cb: BOE
    cb_name: Bank of England
    cb_short: BoE
    policy_indicator: bank_rate
    charts:
      - id: infl
        title: Inflation
        sub: YoY %
        unit: "%"
        ref: 2
        ref_label: BoE target 2%
        series:
          - {name: CPI, canonical: cpi_headline_yoy}
          - {name: Core CPI, canonical: core_cpi_yoy}
          - {name: Services CPI, canonical: null}
      - id: pay
        title: Pay and labour
        sub: YoY % and unemployment %
        unit: "%"
        series:
          - {name: Regular pay growth, canonical: avg_earnings_excl_bonus}
          - {name: Private-sector pay, canonical: null}
          - {name: Unemployment, canonical: unemployment_rate}
      - id: growth
        title: Growth and PMIs
        sub: Monthly GDP % and PMI diffusion indexes
        unit: ""
        series:
          - {name: Monthly GDP, canonical: gdp_mom}
          - {name: Manufacturing PMI, canonical: manufacturing_pmi}
          - {name: Services PMI, canonical: services_pmi}
  JPY:
    enabled: true
    name: Yen Desk
    currency: JPY
    country: JP
    curve_country: JP
    cb: BOJ
    cb_name: Bank of Japan
    cb_short: BoJ
    policy_indicator: boj_interest_rate_decision
    charts:
      - id: infl
        title: Inflation
        sub: YoY %
        unit: "%"
        ref: 2
        ref_label: BoJ target 2%
        series:
          - {name: Tokyo CPI ex fresh food, canonical: tokyo_core_cpi_yoy}
          - {name: National CPI ex fresh food, canonical: core_cpi_yoy}
          - {name: National core-core CPI, canonical: cpi_ex_food_energy_yoy}
      - id: activity
        title: Pay and activity
        sub: Wages, Tankan, services PPI and GDP
        unit: ""
        series:
          - {name: Wage growth, canonical: null}
          - {name: Tankan large manufacturers, canonical: tankan_large_manufacturers_index}
          - {name: Services PPI, canonical: null}
          - {name: GDP QoQ, canonical: gdp_qoq}
  AUD: {enabled: false}
  NZD: {enabled: false}
  CAD:
    enabled: true
    name: Canadian Dollar Desk
    currency: CAD
    country: CA
    curve_country: CA
    cb: BOC
    cb_name: Bank of Canada
    cb_short: BoC
    policy_indicator: overnight_rate
    charts:
      - id: infl
        title: Inflation
        sub: YoY %
        unit: "%"
        ref: 2
        ref_label: BoC target 2%
        series:
          - {name: CPI, canonical: cpi_headline_yoy}
          - {name: CPI-trim, canonical: cpi_trimmed_mean_yoy}
          - {name: CPI-median, canonical: cpi_median_yoy}
      - id: labour
        title: Labour Force Survey
        sub: Monthly employment change and unemployment %
        unit: ""
        series:
          - {name: Employment change, canonical: employment_change}
          - {name: Unemployment, canonical: unemployment_rate}
      - id: growth
        title: Monthly GDP
        sub: Month on month %
        unit: "%"
        series:
          - {name: GDP MoM, canonical: gdp_mom}
  CHF:
    enabled: true
    name: Swiss Franc Desk
    currency: CHF
    country: CH
    curve_country: CH
    cb: SNB
    cb_name: Swiss National Bank
    cb_short: SNB
    policy_indicator: policy_rate
    charts:
      - id: infl
        title: Inflation
        sub: YoY %
        unit: "%"
        ref: 2
        ref_label: SNB price stability
        series:
          - {name: CPI, canonical: cpi_headline_yoy}
          - {name: Core CPI, canonical: null}
      - id: activity
        title: Activity
        sub: KOF, PMI, unemployment and GDP
        unit: ""
        series:
          - {name: KOF leading indicator, canonical: null}
          - {name: Manufacturing PMI, canonical: null}
          - {name: Unemployment, canonical: unemployment_rate}
          - {name: GDP QoQ, canonical: gdp_qoq}
