hedge funds: Active investment funds whose futures positions are reported as leveraged funds.
fast money: Hedge funds and other leveraged funds that can change their bets quickly.
asset managers: Funds investing for clients such as pensions and long-term savings plans.
slow money: Asset managers and other investors with a longer investment horizon.
dealers: Banks and intermediaries that often hold futures to offset trades with their clients.
COT report: A weekly CFTC report of futures positions held on the preceding Tuesday.
open interest: The total number of outstanding futures contracts in one market.
net position: Long positions minus short positions for one trader group.
percentile: Where a reading sits among its past readings on a scale from zero to one hundred.
crowded: A bet near one end of its own historical range.
squeeze: A fast price move that puts pressure on traders to close a crowded bet.
retail traders: Individual traders rather than large investment institutions.
"% by volume": The percentage of reported trading volume on one side rather than the percentage of accounts.
