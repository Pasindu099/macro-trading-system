# Indicator canonicalization rules.
#
# Each entry defines how to interpret one kind of EODHD event.
# The canonicalizer matches incoming events using (eodhd_type, eodhd_comparison, country).
# Multiple raw EODHD types can map to the same canonical_name (useful for aliases
# like "CPI" and "Inflation Rate" both being headline CPI).
#
# FIELDS PER ENTRY:
#   eodhd_type          (required) EXACT string as it appears in EODHD's `type` field.
#                                  Matching is case-sensitive.
#   eodhd_comparison    (optional) "mom", "qoq", "yoy", or null. If null, matches events
#                                  where EODHD's comparison field is null.
#   country             (required) EODHD country code: US, EU, UK, JP, AU, NZ, CA, CH.
#   canonical_name      (required) Stable snake_case identifier. Do NOT rename once used.
#   display_name        (required) Human-readable name shown in UI.
#   primary_category    (required) One of: Inflation, Growth, Labor, Monetary Policy,
#                                  Trade, Sentiment, Housing, Other
#   secondary_categories (optional) List of additional categories (defaults to []).
#   frequency           (required) daily, weekly, monthly, quarterly, irregular
#   unit                (optional) "%", "index", "USD", "count", "thousands", etc.
#   is_higher_better_for_currency (optional, default true) — affects default color coding
#                                  in UI. Example: unemployment LOW is good → false.
#   importance          (optional, default 2) — 1 = top-tier (CPI, NFP), 2 = notable,
#                                  3 = minor. Used for "biggest surprises" ranking.
#   notes               (optional) — freeform comments, aliases, warnings.
#
# HOW TO ADD A NEW MAPPING:
#   1. Find the unmapped event in the admin dashboard (Step 3) or in the logs.
#   2. Add a new entry below, following the same structure.
#   3. No code change, no migration — just restart the app.
#
# HOW TO HANDLE ALIAS EVENTS:
#   EODHD sometimes sends 2+ event types for the same economic release:
#     - "CPI" (yoy) value=3.3
#     - "Inflation Rate" (yoy) value=3.3   ← same number
#   Map both to the same canonical_name. The canonicalizer will prefer
#   the first entry (precedence by YAML order) when both arrive in one fetch.

