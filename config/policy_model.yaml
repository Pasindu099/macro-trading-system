# Experimental display-only policy rule. Missing source values remain unavailable.
model_version: taylor-0.1
freshness_days: {inflation: 100, output_gap: 365, neutral_rate: 365, market: 7}
oecd_url: https://sdmx.oecd.org/public/rest/data/OECD.ECO.MAD,DSD_EO@DF_EO,/USA+EA17+GBR+JPN+CAN+CHE+AUS+NZL.GAP.A
oecd_vintage: {name: Economic Outlook 119, dataflow_version: "1.5", published_at: 2026-06-03, source_url: https://www.oecd.org/en/topics/sub-issues/economic-outlook.html}
nyfed_url: https://www.newyorkfed.org/medialibrary/media/research/economists/williams/data/Holston_Laubach_Williams_current_estimates.xlsx
nyfed_vintage: {last_period: 2026Q2, published_at: 2026-08-28, source_url: https://www.newyorkfed.org/research/policy/rstar}
boc_valet_url: https://www.bankofcanada.ca/valet/observations/CPI_TRIM,CPI_MEDIAN/json
banks:
  FED: {country: US, oecd: USA, inflation: core_pce_price_index_yoy, inflation_label: Core PCE (YoY), inflation_fallback: core_cpi_yoy, fallback_label: Core CPI (YoY), neutral: nyfed_us}
  ECB: {country: EU, oecd: EA17, inflation: core_cpi_yoy, inflation_label: Core HICP (YoY), neutral: nyfed_ea}
  BOE: {country: UK, oecd: GBR, inflation: core_cpi_yoy, inflation_label: Core CPI (YoY), neutral: boe_taylor_real_midpoint}
  BOJ: {country: JP, oecd: JPN, inflation: core_cpi_yoy, inflation_label: Core CPI (YoY), neutral: boj_range_midpoint}
  BOC: {country: CA, oecd: CAN, inflation: cpi_trimmed_mean_yoy, inflation_fallback: core_cpi_yoy, fallback_label: Core CPI (YoY), neutral: nyfed_ca}
  RBA: {country: AU, oecd: AUS, inflation: rba_trimmed_mean_cpi_yoy, inflation_label: RBA trimmed-mean CPI (YoY), inflation_fallback: rba_weighted_median_cpi_yoy, fallback_label: RBA weighted-median CPI (YoY), neutral: rba_nominal_range_midpoint}
  RBNZ: {country: NZ, oecd: NZL, inflation: null, neutral: rbnz_nominal_neutral}
  SNB: {country: CH, oecd: CHE, inflation: null, neutral: snb_real_neutral}
neutral_fallbacks:
  boe_taylor_real_midpoint:
    value: 0.875
    basis: Midpoint of Alan Taylor's 2.75-3.00% nominal neutral range less the 2% inflation target; individual MPC member estimate, not a committee estimate
    published_at: 2026-09-29
    source_url: https://www.bankofengland.co.uk/speech/2026/september/searching-for-signposts-speech-by-alan-taylor
    confidence: low
  boj_range_midpoint:
    value: -0.25
    basis: midpoint of published -1.0 to +0.5 real neutral range; experimental, not a BoJ point estimate
    published_at: 2026-02-06
    source_url: https://www.boj.or.jp/en/about/press/koen_2026/ko260206a.htm
    confidence: low
  rba_nominal_range_midpoint:
    value: 1.1
    basis: RBA February 2026 nominal neutral range 3.0-4.2 midpoint 3.6 less 2.5 inflation target midpoint; derived real midpoint
    published_at: 2026-02-03
    source_url: https://www.rba.gov.au/publications/smp/2026/feb/pdf/statement-on-monetary-policy-2026-02.pdf
    confidence: low
  rbnz_nominal_neutral:
    value: 1.0
    basis: RBNZ February 2026 long-term nominal neutral OCR around 3 less 2 inflation target midpoint; derived real value
    published_at: 2026-02-18
    source_url: https://www.rbnz.govt.nz/monetary-policy/monetary-policy-statement/monetary-policy-statement-filtered-listing-page/2026/feb-182/monetary-policy-statement-february-2026/web-version
    confidence: low
  snb_real_neutral:
    value: 0.0
    basis: SNB governing-board speech says r-star around zero; older published estimate, low confidence
    published_at: 2024-05-30
    source_url: https://www.snb.ch/public/publication/en/www-snb-ch/publications/communication/speeches/2024/ref_20240530_tjn/publications0_en/ref_20240530_tjn.en.pdf
    confidence: low
    max_age_days: 1000
