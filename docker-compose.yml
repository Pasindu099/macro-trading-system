services:
  postgres:
    image: postgres:15-alpine
    container_name: macro_dashboard_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: macro_dashboard_dev
      POSTGRES_USER: macro_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me_in_real_env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U macro_user -d macro_dashboard_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: macro_dashboard_postgres_data