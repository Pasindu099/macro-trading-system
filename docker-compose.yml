services:
  postgres:
    image: postgres:15-alpine
    container_name: macro_dashboard_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: macro_dashboard_dev
      POSTGRES_USER: macro_user
      POSTGRES_PASSWORD: MyMacro2026Pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U macro_user -d macro_dashboard_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: macro_dashboard_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://macro_user:MyMacro2026Pass@postgres:5432/macro_dashboard_dev
      - EODHD_API_KEY=69e3b037bd2fa6.04084397
      - GOOGLE_DRIVE_API_KEY=${GOOGLE_DRIVE_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - BANK_RESEARCH_DRIVE_FOLDER_URL=${BANK_RESEARCH_DRIVE_FOLDER_URL:-}
      - BANK_RESEARCH_RETENTION_DAYS=${BANK_RESEARCH_RETENTION_DAYS:-7}
      - AUTH_ENABLED=false
      - LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/venv
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
    name: macro_dashboard_postgres_data
