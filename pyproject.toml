[project]
name = "macro-dashboard"
version = "0.1.0"
description = "Macro economic dashboard for FX trading — Phase 1"
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "apscheduler>=3.10.4",
    "pyyaml>=6.0.2",
    "jinja2>=3.1.4",
    "pandas>=2.2.0",
    "pypdf>=4.3.1",
    "plotly>=5.24.0",
    "python-dotenv>=1.0.1",
    "anthropic>=0.97.0",
    "reportlab>=4.2.5",
    "scikit-learn>=1.5.0",
    "statsmodels>=0.14.4",
    "yfinance>=0.2.54",
    "feedparser>=6.0.11",
    "openai>=1.0.0",
    "python-multipart>=0.0.9",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=7.2.0",
    "nbclient>=0.10.4",
    "nbformat>=5.10.4",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "aiosqlite>=0.20.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "scripts*", "config*", "migrations*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
